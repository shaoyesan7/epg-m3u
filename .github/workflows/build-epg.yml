name: Regenerate EPG
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Build EPG
        run: |
          set -e
          M3U_FILE=$(find m3u -maxdepth 1 -name '*.m3u' | head -1)
          echo "Using M3U: $M3U_FILE"
          # 生成当天时间戳的文件名，绕开 Pages CDN 缓存
          DATE=$(date +%Y%m%d)
          python3 epg_build.py --m3u "$M3U_FILE" --out "epg/epg-$DATE.xml" --gzip --autofill --past 7 --future 3
          ls -la epg/
      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg/
          git commit -m "auto: regenerate EPG $(date -u +\%Y-\%m-\%d)" || exit 0
          git push
