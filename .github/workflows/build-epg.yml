name: Regenerate EPG

# 每天 00:00 UTC（北京时间 08:00）抓取上游 EPG，commit 回仓库 epg/ 目录，
# GitHub Pages（branch 部署）自动发布，App 端 EPG 即更新。
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build EPG
        run: |
          set -e
          M3U_FILE=$(find m3u -maxdepth 1 -name '*.m3u' | head -1)
          echo "Using M3U: $M3U_FILE"
          python3 epg_build.py --m3u "$M3U_FILE" --out epg/epg.xml --gzip --autofill --past 7 --future 3
          ls -la epg/

      - name: Commit & push updated EPG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg/epg.xml epg/epg.xml.gz
          if git diff --cached --quiet; then
            echo "EPG unchanged, skip commit"
          else
            git commit -m "auto: regenerate EPG $(date -u +\%Y-\%m-\%d)"
            git push
          fi
